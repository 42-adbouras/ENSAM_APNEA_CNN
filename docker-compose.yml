services:
  database:
    image: apnea-database:0.2
    container_name: apnea_database
    build:
      context: ./services/database
    env_file: .env
    networks:
      - apnea
    volumes:
      - ./services/database/data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$DB_USER\" -d \"$$DB_NAME\""]
      interval: 5s
      timeout: 5s
      retries: 10

  inference:
    image: apnea-inference:0.2
    container_name: apnea_inference
    build:
      context: ./services/inference
    env_file: .env
    networks:
      - apnea
    depends_on:
      database:
        condition: service_healthy
    volumes:
      - ./services/inference/data/models:/models
      - ./services/inference/demo:/demo:ro
      - ./data/apnea-ecg:/apnea-ecg
      - ./results:/results

  nginx:
    image: apnea-nginx:0.2
    container_name: apnea_nginx
    build:
      context: ./services/nginx
    ports:
      - "443:443"
    networks:
      - apnea
    depends_on:
      - inference

networks:
  apnea:
    name: apnea_network
    driver: bridge
