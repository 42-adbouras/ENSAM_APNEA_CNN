services:
  database:
    image: apnea-database:0.2
    container_name: apnea_database
    build:
      context: ./services/database
    env_file: .env
    volumes:
      - ./services/database/data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$DB_USER\" -d \"$$DB_NAME\""]
      interval: 5s
      timeout: 5s
      retries: 10

  inference:
    image: apnea-inference:0.2
    container_name: apnea_inference
    build:
      context: ./services/inference
    ports:
      - "8000:8000"
    env_file: .env
    depends_on:
      database:
        condition: service_healthy
    volumes:
      - ./services/inference/data/models:/models
