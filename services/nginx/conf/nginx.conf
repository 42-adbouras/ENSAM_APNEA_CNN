# ── nginx: HTTPS on port 443, every request passed on to the inference service ──

user www-data;
worker_processes auto;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    access_log /dev/stdout;
    server_tokens off;

    # Docker's DNS server; an address it returns is reused for 10 seconds
    resolver 127.0.0.11 valid=10s ipv6=off;

    server {
        listen 443 ssl http2;
        server_name localhost;

        ssl_certificate     /etc/nginx/ssl/apnea.crt;
        ssl_certificate_key /etc/nginx/ssl/apnea.key;
        ssl_protocols       TLSv1.2 TLSv1.3;

        # A plain HTTP request sent to this port is redirected to HTTPS
        error_page 497 =301 https://$http_host$request_uri;

        # Largest request body: one night's .csv file
        client_max_body_size 200m;

        # Time the service has to answer, for example while it analyses a night
        proxy_read_timeout 300s;

        location / {
            # A variable in proxy_pass makes nginx look up "inference" through the resolver
            # while it runs, so a recreated inference container is found at its new address
            set $inference http://inference:8000;
            proxy_pass $inference;

            proxy_set_header Host              $http_host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
